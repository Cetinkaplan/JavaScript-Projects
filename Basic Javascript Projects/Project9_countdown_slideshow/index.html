<!--index.html-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Image Slideshow Project</title>
    <link rel="stylesheet" type="text/css" href="CSS/style.css" />
</head>

<body>

<!-- Countdown Timer Section -->
<p>Enter the number of seconds for the timer:</p>
<input type="number" id="seconds" value="" />
<button onclick="countdown()" id="startBtn">Start Timer</button>
<p id="timer"></p>

<!-- Slideshow Section -->
<div class="slideshow-container">

    <!-- Full images with caption text -->
    <div class="mySlides fade">
        <div class="numbertext">1 / 3</div>
        <img src="img/img1.png" style="width:100%" alt="Snow Mountain" />
        <div class="text">Beautiful snowy mountain</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">2 / 3</div>
        <img src="img/img2.png" style="width:100%" />
        <div class="text">Snowy forest road</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">3 / 3</div>
        <img src="img/img3.png" style="width:100%" />
        <div class="text">Deer walking in snow</div>
    </div>

    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>

<br />

<!-- Current slide selection circles -->
<div style="text-align:center">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
</div>

<script src="JS/main.js"></script>

</body>

</html>
